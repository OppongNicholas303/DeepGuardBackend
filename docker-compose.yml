version: '3.8'

services:
  app:
    build: .
    ports:
      - "9080:9080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/deepguard
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AIzaSyAGiJbIG7z1vVE8vlMU_iv-DICH6S59nE0}
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=deepguard
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: