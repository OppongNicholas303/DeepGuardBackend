server:
  port: 9080

spring:
  application:
    name: document-analysis
  datasource:
    url: jdbc:postgresql://ep-orange-lab-a4pezd7l.us-east-1.aws.neon.tech/neondb?sslmode=require&connectTimeout=30&socketTimeout=30&tcpKeepAlive=true
    username: neondb_owner
    password: npg_xr8gmisZRB9C
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 5
      minimum-idle: 1
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    show-sql: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  task:
    execution:
      pool:
        core-size: 8
        max-size: 16
        queue-capacity: 100
        thread-name-prefix: analysis-
        wait-for-tasks-completion-on-shutdown: true
        shutdown:
          await-termination-period: 30s
  retry:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:your-very-secure-secret-key-that-should-be-at-least-256-bits-long}
    expiration: 900000
    refresh-expiration: 86400000
  max-file-size-mb: 100
  supported-formats: jpg,jpeg,png,pdf,webp,bmp
  analysis-timeout-seconds: 30

gemini:
  enabled: true
  api-key: ${GEMINI_API_KEY:AIzaSyAGiJbIG7z1vVE8vlMU_iv-DICH6S59nE0}
  model: gemini-2.0-flash
  temperature: 0.5
  max-tokens: 2000
  timeout: 30000
  max-retries: 3