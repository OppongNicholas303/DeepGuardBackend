server:
  port: 9080

spring:
  application:
    name: document-analysis
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deepguard}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  task:
    execution:
      pool:
        core-size: 8
        max-size: 16
        queue-capacity: 100
        thread-name-prefix: analysis-
        wait-for-tasks-completion-on-shutdown: true
        shutdown:
          await-termination-period: 30s
  retry:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:your-very-secure-secret-key-that-should-be-at-least-256-bits-long}
    expiration: 900000
    refresh-expiration: 86400000
  max-file-size-mb: 100
  supported-formats: jpg,jpeg,png,pdf,webp,bmp
  analysis-timeout-seconds: 30

gemini:
  enabled: true
  api-key: ${GEMINI_API_KEY:AIzaSyAGiJbIG7z1vVE8vlMU_iv-DICH6S59nE0}
  model: gemini-2.0-flash
  temperature: 0.5
  max-tokens: 2000
  timeout: 30000
  max-retries: 3