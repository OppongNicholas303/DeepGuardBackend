spring:
  application:
    name: deepguard-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Database Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deepguard}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:NicTech23}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # JPA Configuration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${SPRING_JPA_HIBERNATE_FORMAT_SQL:false}
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
        batch_size: 25
        fetch_size: 50
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    defer-datasource-initialization: true

  # Data Configuration (MongoDB & Redis)
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/deepguard-logs}
      auto-index-creation: true
      auto-index-creation-drop-collection: false
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes

  # Security Configuration
  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME:admin}
      password: ${SPRING_SECURITY_USER_PASSWORD:admin123}
      roles: ${SPRING_SECURITY_USER_ROLES:ADMIN}

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${EMAIL_USERNAME:nicholas.oppong2623@gmail.com}
    password: ${EMAIL_PASSWORD:ireb znzo qreb frbd}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "*"
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2KB
      location: ${java.io.tmpdir}

  # SQL Initialization
  sql:
    init:
      mode: never

# Application Configuration
app:
  jwt:
    secret: ${JWT_SECRET:your-very-secure-secret-key-that-should-be-at-least-256-bits-long-and-stored-in-environment-variables}
    expiration: ${JWT_EXPIRATION:900000} # 15 minutes
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000} # 24 hours
    issuer: ${JWT_ISSUER:deepguard}
    audience: ${JWT_AUDIENCE:deepguard-users}

  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

  file:
    upload:
      path: ${FILE_UPLOAD_PATH:./uploads}
      max-size: 100MB
      allowed-types: image/jpeg,image/png,image/gif,video/mp4,video/avi,video/mov,audio/mp3,audio/wav

  ai:
    model:
      timeout: ${AI_MODEL_TIMEOUT:300000} # 5 minutes
      max-concurrent: ${AI_MODEL_MAX_CONCURRENT:5}

  monitoring:
    breach:
      check-interval: ${BREACH_CHECK_INTERVAL:300000} # 5 minutes
      batch-size: ${BREACH_BATCH_SIZE:100}

# Management and Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,configprops
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
    info:
      enabled: true
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}
  ssl:
    enabled: ${SSL_ENABLED:false}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# Logging Configuration
logging:
  level:
    root: INFO
    com.deepquard: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.cache: DEBUG
    io.github.resilience4j: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/deepguard.log}
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
    filter: true
  packages-to-scan: DeepQuard.DeepGuardBackend.controller
  show-actuator: true

# Resilience4j Configuration
resilience4j:
  ratelimiter:
    instances:
      auth:
        limit-for-period: 5
        limit-refresh-period: 60s
        timeout-duration: 1s
        subscribe-for-events: true
      api:
        limit-for-period: 100
        limit-refresh-period: 60s
        timeout-duration: 1s
        subscribe-for-events: true
      upload:
        limit-for-period: 10
        limit-refresh-period: 60s
        timeout-duration: 5s
        subscribe-for-events: true
  circuitbreaker:
    instances:
      ai-service:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        subscribe-for-events: true
  retry:
    instances:
      ai-service:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        subscribe-for-events: true



---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    com.deepquard: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never
logging:
  level:
    root: WARN
    com.deepquard: INFO