server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  task:
    execution:
      pool:
        core-size: 8
        max-size: 16
        queue-capacity: 100
        thread-name-prefix: analysis-
        wait-for-tasks-completion-on-shutdown: true
        shutdown:
          await-termination-period: 30s

gemini:
  api-key: ${GEMINI_API_KEY:your-gemini-api-key}
  model: gemini-2.0-flash
  temperature: 0.5
  max-tokens: 2000

app:
  max-file-size-mb: 100
  supported-formats: jpg,jpeg,png,pdf,webp,bmp
  analysis-timeout-seconds: 30